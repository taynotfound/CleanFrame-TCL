plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('CLEANFRAME_KEYSTORE')

// Every commit is a new version: versionCode is the commit count, versionName 0.8.<count>.
// Local builds and the release workflow (full clone) get the same numbers for the same commit.
def commitCount = { ->
    try { def n = 'git rev-list --count HEAD'.execute(null, rootProject.projectDir).text.trim(); return n.isInteger() ? n.toInteger() : 2 }
    catch (Exception ignored) { return 2 }
}()

// Optional API keys: android/local.properties (ignored by git) or environment variables.
def localProps = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { localProps.load(it) }
// SHORE_PUBLIC_BUILD=1 leaves every key out, for an APK that can be published.
def publicBuild = System.getenv('SHORE_PUBLIC_BUILD') == '1'
def secret = { String prop, String env, String fallback -> (publicBuild ? fallback : localProps.getProperty(prop) ?: System.getenv(env) ?: fallback).replace('"', '') }

android {
    namespace 'app.cleanframe.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'app.cleanframe.tv'
        minSdk 26
        targetSdk 35
        versionCode commitCount
        versionName "0.8.${commitCount}"
        buildConfigField 'boolean', 'PUBLIC_BUILD', publicBuild ? 'true' : 'false'
        buildConfigField 'String', 'UNSPLASH_ACCESS_KEY', '"' + secret('unsplash.accessKey', 'UNSPLASH_ACCESS_KEY', '') + '"'
        buildConfigField 'String', 'PEXELS_API_KEY', '"' + secret('pexels.apiKey', 'PEXELS_API_KEY', '') + '"'
        buildConfigField 'String', 'KLIPY_API_KEY', '"' + secret('klipy.apiKey', 'KLIPY_API_KEY', '') + '"'
        buildConfigField 'String', 'NASA_API_KEY', '"' + secret('nasa.apiKey', 'NASA_API_KEY', 'DEMO_KEY') + '"'
        // Top Shelf recommendations (Shelf layout). Missing keys fall back to the app's banner.
        // Music view: album covers from Last.fm when the app's own cover is small and iTunes has none.
        buildConfigField 'String', 'LASTFM_API_KEY', '"' + secret('lastfm.apiKey', 'LASTFM_API_KEY', '') + '"'
        buildConfigField 'String', 'TMDB_TOKEN', '"' + secret('tmdb.token', 'TMDB_TOKEN', '') + '"'
        buildConfigField 'String', 'YOUTUBE_API_KEY', '"' + secret('youtube.apiKey', 'YOUTUBE_API_KEY', '') + '"'
        buildConfigField 'String', 'TWITCH_CLIENT_ID', '"' + secret('twitch.clientId', 'TWITCH_CLIENT_ID', '') + '"'
        buildConfigField 'String', 'TWITCH_CLIENT_SECRET', '"' + secret('twitch.clientSecret', 'TWITCH_CLIENT_SECRET', '') + '"'
    }
    buildFeatures { buildConfig true }

    // The web UI in app/ is packaged as-is.
    sourceSets {
        // assets-android/ holds Android-only files (bundled animated loops) not part of the shared interface.
        main { assets.srcDirs = ['../../app', 'src/main/assets-android'] }
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('CLEANFRAME_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CLEANFRAME_KEY_ALIAS')
                keyPassword System.getenv('CLEANFRAME_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.zxing:core:3.5.3' // QR code for the phone upload page
}
