version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-tools: { patterns: ['*'] }
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
