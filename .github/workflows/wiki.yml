name: Wiki

# Copies docs/wiki/ to the repository's GitHub wiki. The wiki must be enabled
# (Settings › Features › Wikis) and have at least one page, created once by hand,
# before the first run can push.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish docs/wiki to the wiki
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" wiki; then
            echo "::notice::The wiki is not set up yet. Enable Wikis in the repository settings and create its first page, then run this workflow again."
            exit 0
          fi
          find wiki -maxdepth 1 -name '*.md' -delete
          cp docs/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git commit -m "Sync from docs/wiki (${GITHUB_SHA::7})"
          git push
